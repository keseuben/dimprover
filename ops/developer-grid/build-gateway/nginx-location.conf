# A mcp.dimprover.hu TLS server blokkban.
# A canonical Developer Grid kliens domainen keresztül kapcsolódik; az IP csak hálózati allowlist.
location /build-gateway/v1/ {
    allow 213.160.68.32; # canonical DEV VPS
    allow 127.0.0.1;
    deny all;

    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-DIMPRO-Build-Gateway-Proxy 1;
    proxy_read_timeout 300;
    proxy_connect_timeout 30;
    proxy_send_timeout 300;
}
