    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#123f3a" flood-opacity=".13"/></filter>
    <pattern id="hexgrid" width="72" height="62" patternUnits="userSpaceOnUse"><path d="M18 1h36l17 30-17 30H18L1 31z" fill="none" stroke="#89bcb4" stroke-opacity=".12"/></pattern>
    <symbol id="cube" viewBox="0 0 40 44">
      <polygon points="20,0 39,10 20,20 1,10" fill="currentColor" opacity=".82"/>
      <polygon points="1,10 20,20 20,43 1,33" fill="currentColor" opacity=".98"/>
      <polygon points="39,10 20,20 20,43 39,33" fill="currentColor" opacity=".68"/>
      <path d="M20 20v23M1 10l19 10 19-10" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
    </symbol>
    <symbol id="platform" viewBox="0 0 230 120">
