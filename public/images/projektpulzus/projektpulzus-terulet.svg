<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Projektpulzus – Terület nézet</title>
  <desc id="desc">Öt projektrész eltérő előrehaladása absztrakt kockatornyokkal.</desc>
  <defs>
