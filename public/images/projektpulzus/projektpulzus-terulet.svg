      <path d="M56 17h118l38 43-38 43H56L18 60z" fill="#edf7f5" stroke="#7ec5bd" stroke-width="2"/>
      <path d="M56 103h118l38-43v13l-38 39H56L18 73V60z" fill="#d5e7e4" opacity=".85"/>
    </symbol>
  </defs>
  <rect width="1600" height="620" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="26" fill="url(#hexgrid)"/>
  <g fill="none" stroke="#5b9f96" stroke-opacity=".16" stroke-width="2">
